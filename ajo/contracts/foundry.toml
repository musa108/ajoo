[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"        # verify against Monad's supported EVM version before mainnet deploy
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

# Offline sandbox profile: use a locally installed solc binary instead of downloading one.
[profile.sandbox]
solc = "/home/claude/tools/solc"
